[package]
name = "tickers"
version = "0.15.0"
authors = ["tarkah <admin@tarkah.dev>", "Juha Lehtinen"]
edition = "2021"
license = "MIT"
repository = "https://github.com/jtlehtinen/tickers"
publish = false
readme = "README.md"
description = "Realtime ticker data in your terminal 📈"
keywords = ["tui", "terminal", "stocks"]
categories = ["command-line-utilities"]

[profile.release]
lto = true

[workspace]
members = [
    ".",
    "api",
]

[dependencies]
anyhow = "1.0"
async-std = "1.13"
better-panic = "0.3"
chrono = "0.4"
crossbeam-channel = "0.5"
crossterm = "0.29" # use the same version as ratatui
dirs-next = "2.0.0"
futures = "0.3"
itertools = "0.15"
lazy_static = "1.5"
parking_lot = "0.12.5"
rclite = "0.4.2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
unicode-width = "0.2.2"
tickers-api = { path = "api/", version = "0.15.0" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "serde"] }
clap = { version = "4.6", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
