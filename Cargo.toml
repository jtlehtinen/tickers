[package]
name = "tickrs"
version = "0.15.0"
authors = ["tarkah <admin@tarkah.dev>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/tarkah/tickrs"
readme = "README.md"
description = "Realtime ticker data in your terminal 📈"
keywords = ["tui", "terminal", "stocks"]
categories = ["command-line-utilities"]

[profile.release]
lto = true

[workspace]
members = [
    ".",
    "api",
]

[dependencies]
anyhow = "1.0"
async-std = "1.12"
better-panic = "0.3"
chrono = "0.4"
crossbeam-channel = "0.5"
crossterm = "0.27" # use the same version as ratatui
dirs-next = "2.0.0"
futures = "0.3"
itertools = "0.10"
lazy_static = "1.4"
parking_lot = "0.12.1"
rclite = "0.1.5"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
unicode-width = "0.1.10"
tickrs-api = { path = "api/", version = "0.15.0" }
ratatui = { version = "0.25.0", default-features = false, features = ["crossterm", "serde"] }
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
