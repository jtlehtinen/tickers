[package]
name = "tickers-api"
version = "0.15.0"
authors = ["tarkah <admin@tarkah.dev>", "Juha Lehtinen"]
edition = "2021"
license = "MIT"
description = "API for tickers"
repository = "https://github.com/jtlehtinen/tickers"
publish = false

[dependencies]
anyhow = "1.0"
async-lock = "3.4"
futures = "0.3"
http = "0.2" # must match the version used by isahc
isahc = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"

[dev-dependencies]
async-std = { version = "1", features = ["attributes"] }
