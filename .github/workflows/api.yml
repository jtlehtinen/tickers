on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

name: API

jobs:
  test:
    name: "Live API tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v2

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-api-${{ hashFiles('**/Cargo.lock') }}

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      # These tests hit Yahoo Finance, so they're ignored in the regular test
      # workflow and run on a schedule to catch upstream API changes
      - name: Run live API tests
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: -p tickrs-api -- --ignored
